plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

// --- which Minecraft --------------------------------------------------------------------------------
//
// 26.1.2 is the default (gradle.properties). -Pminecraft_version=26.2 builds and runs everything against 26.2,
// the same switch killer560s-mod uses. The versions that must move WITH Minecraft are filled in from the table
// below unless they are passed on the command line too, so the one flag is enough; an explicit
// -Pfabric_api_version / -Ploader_version / -Pcloud_version still wins. Parsed the way the mod parses it: a
// fixed [0..1] slice throws on a two-component version like "26.2".
def mcParts = project.minecraft_version.toString().tokenize('.')
def mcMinorVersion = mcParts.size() >= 2 ? "${mcParts[0]}.${mcParts[1]}" : "${mcParts[0]}"
def mcBranch = "mc" + (mcParts.size() >= 2 ? "${mcParts[0]}_${mcParts[1]}" : mcParts[0])
def versionsByMinecraft = [
	// 26.1.x: exactly what gradle.properties says, so the default build is unchanged.
	'26.1': [:],
	// 26.2: Fabric API as the mod builds it; loader as killer560's "26.2 mod only" Prism instance runs it. Cloud
	// beta.17 because beta.16 is the 26.1 build and beta.17 declares minecraft >=26.2 (and is the one GrimAC
	// itself nests).
	'26.2': [fabric_api_version: '0.160.0+26.2', loader_version: '0.19.5', cloud_version: '2.0.0-beta.17'],
]
def versionDefaults = versionsByMinecraft[mcMinorVersion]
if (versionDefaults == null) {
	throw new GradleException("No version table for Minecraft ${project.minecraft_version}: add it to "
			+ "versionsByMinecraft in build.gradle (Fabric API, loader, cloud-fabric) and create the "
			+ "src/<set>/${mcBranch}/java compatibility directories.")
}
def cliProps = gradle.startParameter.projectProperties
def pickVersion = { String key ->
	cliProps.containsKey(key) ? cliProps[key] : (versionDefaults[key] ?: project.property(key).toString())
}
def fabricApiVersion = pickVersion("fabric_api_version")
def loaderVersion = pickVersion("loader_version")
def cloudVersion = pickVersion("cloud_version")
logger.lifecycle("Minecraft ${project.minecraft_version}: compatibility layer ${mcBranch}, Fabric API "
		+ "${fabricApiVersion}, loader ${loaderVersion}, cloud-fabric ${cloudVersion}")

repositories {
	// Cloud command framework — GrimAC's Fabric build expects it as a separate mod rather than bundling it.
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()
}

// --- per-Minecraft-version compatibility layer ----------------------------------------------------------
//
// The killer560s-mod pattern: API that differs between Minecraft versions lives in dev.testkit.compat (McCompat,
// McItems, McEntities), and exactly ONE of src/client/mc26_1/java / src/client/mc26_2/java goes on the client
// source path. The gametest source set sees it through sourceSets.client.output. Both copies keep identical
// public signatures; everything under src/*/java stays version-neutral and calls these instead.
def compatDir = file("src/client/${mcBranch}/java")
if (!compatDir.directory) {
	throw new GradleException("No compatibility layer for Minecraft ${project.minecraft_version}: expected "
			+ "${compatDir}. Copy the nearest src/client/mc*/java and fix what moved.")
}
sourceSets.client.java.srcDir compatDir

loom {
	mods {
		"testkit" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${loaderVersion}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"

	// GrimAC persists violations to SQLite and refuses to start without the driver, which its Fabric
	// build does not bundle. Runtime only: a fixture for the test server, never shipped.
	runtimeOnly "org.xerial:sqlite-jdbc:${project.sqlite_version}"
}

// --- the companion server mod ---------------------------------------------------------------------
//
// Server-side helper the scenarios drive through commands. It exists because the anticheat server runs
// as its own process and the harness only reaches it through its console, so anything needing real
// server-side objects — a genuine ServerPlayer, a chunk-loading fill — has to live over there.
sourceSets {
	testmod {
		compileClasspath += sourceSets.main.compileClasspath
		runtimeClasspath += sourceSets.main.runtimeClasspath
	}
}

tasks.register("testmodJar", Jar) {
	from sourceSets.testmod.output
	archiveBaseName = "testkit-server"
	destinationDirectory = layout.buildDirectory.dir("testmod")
}

// --- port, and the Hx bridge port beside it -----------------------------------------------------------
//
// -Pport=N gives this checkout's server port N. It is written into run/testserver/server.properties (which the
// server, TestServer and grimServer all read), so it sticks for later runs of the same checkout until another
// -Pport changes it. The Hx RPC bridge in the companion mod listens on loopback port N+5 (testkit.hx.port, passed to
// BOTH the client and the server JVM). Concurrency still needs separate checkouts: Gradle locks the project dir.
def testServerProps = file("${rootDir}/run/testserver/server.properties")
def requestedPort = project.hasProperty("port") ? project.property("port").toString().trim().toInteger() : null
def effectivePort = {
	if (requestedPort != null) {
		return requestedPort
	}
	if (testServerProps.exists()) {
		def p = new Properties()
		testServerProps.withInputStream { p.load(it) }
		return (p.getProperty("server-port") ?: "25565").trim().toInteger()
	}
	return 25565
}
def serverPort = effectivePort()
def hxPort = serverPort + 5

// --- GrimAC ---------------------------------------------------------------------------------------
//
// Downloaded on demand rather than committed: it is a 14 MB third-party binary and pinning it in the repo would be
// both large and stale. Change grim_version / grim_url to move it. Cached under the GRADLE USER HOME, not this
// checkout's .gradle/, so the main checkout and every worktree share one download; an older per-checkout copy in
// .gradle/grim/ is reused instead of downloading again. Written to a temp file and moved, so two checkouts
// fetching at once never see half a jar.
def grimJar = new File(gradle.gradleUserHomeDir, "caches/testkit-grim/grimac-fabric-${project.grim_version}.jar")
def legacyGrimJar = file("${rootDir}/.gradle/grim/grimac-fabric-${project.grim_version}.jar")

tasks.register("downloadGrim") {
	description = "Fetch the GrimAC build the anticheat tests run against."
	outputs.file(grimJar)
	doLast {
		if (!grimJar.exists()) {
			grimJar.parentFile.mkdirs()
			def tmp = new File(grimJar.parentFile, grimJar.name + ".part-" + ProcessHandle.current().pid())
			if (legacyGrimJar.exists()) {
				logger.lifecycle("GrimAC ${project.grim_version}: reusing ${legacyGrimJar}")
				tmp.bytes = legacyGrimJar.bytes
			} else {
				logger.lifecycle("Downloading GrimAC ${project.grim_version}")
				new URI(project.grim_url).toURL().withInputStream { input ->
					tmp.withOutputStream { out -> out << input }
				}
			}
			if (!grimJar.exists()) {
				java.nio.file.Files.move(tmp.toPath(), grimJar.toPath(), java.nio.file.StandardCopyOption.ATOMIC_MOVE)
			} else {
				tmp.delete()
			}
		}
	}
}

// GrimAC must NOT go on the client's classpath, and that is measured rather than preference. A client
// gametest JVM is EnvType.CLIENT, and there the PacketEvents build Grim bundles installs client-side
// hooks that are incomplete on 26.1.2: getClientLazyPlayerManagerHolder() returns null and the client's
// own connection dies with "Invalid player data" the instant it joins. The anticheat belongs in a
// separate EnvType.SERVER process, which is what prepareTestServer stages.
def testServerDir = file("${rootDir}/run/testserver")

configurations {
	testServerMods
}

dependencies {
	testServerMods "org.incendo:cloud-fabric:${cloudVersion}"
}

tasks.register("prepareTestServer") {
	description = "Stage a dedicated server with GrimAC and the companion mod installed."
	dependsOn "downloadGrim", "testmodJar"
	doLast {
		def mods = new File(testServerDir, "mods")
		mods.mkdirs()

		// -Pnogrim has to mean NO ANTICHEAT, not "ignore what it says". With the jar left in place the anticheat
		// is still installed and still correcting every movement, so a "muted" run measures a watching server
		// while labelling itself a vanilla one. The jar leaves the folder, and anything left over from an
		// older Grim pin goes with it; the current one is put back the moment the flag is not passed.
		mods.listFiles().findAll { it.name.startsWith("grimac-") && it.name != grimJar.name }.each { it.delete() }
		def grim = new File(mods, grimJar.name)
		if (project.hasProperty("nogrim")) {
			if (grim.exists() && grim.delete()) {
				logger.lifecycle("GrimAC removed from the staged server: -Pnogrim")
			}
		} else if (!grim.exists()) {
			grim.bytes = grimJar.bytes
		}
		// Always overwrite the companion mod. Its filename never changes, so an "only if missing" copy
		// silently keeps serving the first build ever staged — which looks exactly like source changes
		// having no effect.
		def testmod = tasks.named("testmodJar").get().archiveFile.get().asFile
		if (testmod.exists()) {
			new File(mods, testmod.name).bytes = testmod.bytes
		}
		// Cloud drags in fabric-loader and fabric-api pieces; the dev runtime already provides those and
		// a second copy in mods/ makes loader complain about duplicates.
		def cloudJars = configurations.testServerMods.findAll {
			it.name.startsWith("cloud-") || it.name.startsWith("geantyref")
		}
		// A server staged for the other Minecraft version left ITS cloud jars here. Two cloud-fabric versions in
		// mods/ is a duplicate mod id, and the 26.1 build (beta.16) next to the 26.2 one is exactly that, so
		// anything this version did not resolve goes before the copy.
		def wanted = cloudJars.collect { it.name } as Set
		mods.listFiles().findAll {
			(it.name.startsWith("cloud-") || it.name.startsWith("geantyref")) && !wanted.contains(it.name)
		}.each { stale ->
			stale.delete()
			logger.lifecycle("Removed ${stale.name} from the staged server (not this Minecraft version's)")
		}
		cloudJars.each { dep ->
			def copy = new File(mods, dep.name)
			if (!copy.exists()) {
				copy.bytes = dep.bytes
			}
		}

		new File(testServerDir, "eula.txt").text = "eula=true\n"
		def props = new File(testServerDir, "server.properties")
		if (!props.exists()) {
			props.text = [
				"# Anticheat test server. Local and disposable.",
				"online-mode=false",
				// The server's own default is true, written on its first start. Harmless while online-mode is off,
				// but it is the other half of what a login needs, so it is pinned alongside.
				"enforce-secure-profile=false",
				"gamemode=creative",
				"difficulty=normal",
				"spawn-protection=0",
				"max-tick-time=-1",
				"view-distance=8",
				"generate-structures=false",
				"spawn-monsters=false",
				"motd=Anticheat test server"
			].join("\n") + "\n"
		}
		// -Pport: patched in place, so every other line the server has written stays as it is.
		if (requestedPort != null) {
			def text = props.text
			def patched = text =~ /(?m)^server-port=.*$/ ? text.replaceAll(/(?m)^server-port=.*$/, "server-port=${requestedPort}")
					: text + "server-port=${requestedPort}\n"
			// query.port defaults to the server port; it only binds with enable-query=true, but keep the pair together.
			patched = patched.replaceAll(/(?m)^query\.port=.*$/, "query.port=${requestedPort}")
			if (patched != text) {
				props.text = patched
				logger.lifecycle("Test server port set to ${requestedPort} (Hx bridge ${requestedPort + 5})")
			}
		}

		// Send verbose to the console. This is what lets a scenario read check output without the test
		// player being an operator — and it must not be one, because Grim treats operators as EXEMPT and
		// an exempt player produces a spotless run for the worst possible reason.
		def grimConfig = new File(testServerDir, "config/GrimAC/config.yml")
		if (grimConfig.exists()) {
			def patched = grimConfig.text.replaceAll(
				/(?m)^(verbose:\s*\n(?:\s*#.*\n)*\s*print-to-console:\s*)false/, '$1true')
			if (patched != grimConfig.text) {
				grimConfig.text = patched
				logger.lifecycle("GrimAC: verbose print-to-console enabled")
			}
		} else {
			logger.lifecycle("GrimAC config not generated yet — run ./gradlew runTestServer once, then this")
		}
		logger.lifecycle("Test server staged at ${testServerDir}")
	}
}

loom {
	runs {
		testServer {
			server()
			configName = "Anticheat Test Server"
			runDir = "run/testserver"
			// The Hx RPC bridge (dev.testkit.server.hx.HxBridge) listens on loopback here. Copied into the launch
			// spec by writeTestServerLaunch, so a gametest-started server gets it too.
			vmArg "-Dtestkit.hx.port=${hxPort}"
		}
	}
}

tasks.matching { it.name == "runTestServer" }.configureEach {
	dependsOn "prepareTestServer"
}

// The client gametests need the SAME server, started by them so a scenario can bring it up, drive it and
// tear it down. Rather than reconstruct a dev launch by hand, this records exactly how loom launches
// runTestServer and lets the test replay it.
// A server you JOIN, rather than one the gametests drive.
//
// killer560 (2026-09-28): "make sure you are able to use it for testing just like the testing server thing
// already that you use". The harness has always started this server, run scenarios against it headless and shut
// it down, which is no use for sitting in a room yourself and watching what an anticheat says about what you do
// by hand. This is the same staged server, same GrimAC pin, left running.
//
// Connect with Direct Connect to localhost:25565. The mod treats a localhost server as a dungeon server in dev
// builds, so solvers, timers and automation actually arm there instead of silently gating themselves off.
//
//   ./gradlew grimServer                       server with GrimAC, join it yourself
//   ./gradlew grimServer -Pnogrim              same, anticheat removed, as a control
//   ./gradlew grimServer -PseedWorld=<path>    start from a copy of a world save
tasks.register("grimServer") {
	group = "verification"
	description = "Start the staged GrimAC server and leave it running so you can join it yourself."
	dependsOn "prepareTestServer", "runTestServer"
	doFirst {
		logger.lifecycle("GrimAC test server starting - Direct Connect to localhost:${serverPort} when it is ready.")
	}
}

tasks.matching { it.name == "runTestServer" }.configureEach {
	mustRunAfter "prepareTestServer"
}

// Copy a world into the staged server before it starts. The point of it is the dungeon sim: once rooms are
// captured and a map is built, this is how that world gets in front of a real anticheat.
tasks.matching { it.name == "prepareTestServer" }.configureEach {
	doLast {
		if (project.hasProperty("seedWorld")) {
			def src = file(project.property("seedWorld"))
			if (!src.isDirectory()) {
				throw new GradleException("-PseedWorld must point at a world SAVE FOLDER; got ${src}")
			}
			def dst = new File(testServerDir, "world")
			// Replaced, not merged: a half-overwritten world is the kind of thing that looks like a corrupt
			// save days later and gets blamed on the mod.
			if (dst.exists()) {
				delete(dst)
			}
			copy {
				from src
				into dst
			}
			logger.lifecycle("Seeded the test server world from ${src}")
		}
	}
}

tasks.register("writeTestServerLaunch") {
	description = "Record how to launch the test server, for the client gametests."
	dependsOn "prepareTestServer"
	def launchFile = layout.buildDirectory.file("testserver-launch.properties")
	outputs.file(launchFile)
	// Outputs and no inputs would let Gradle call this UP-TO-DATE and keep a launch spec with the previous run's
	// Hx port in it. It is a few lines of text; always write it.
	outputs.upToDateWhen { false }
	doLast {
		def run = tasks.named("runTestServer").get()
		def props = new Properties()
		props.setProperty("java", org.gradle.internal.jvm.Jvm.current().javaExecutable.absolutePath)
		props.setProperty("main", run.mainClass.get())
		props.setProperty("dir", testServerDir.absolutePath)
		props.setProperty("classpath", run.classpath.files.collect { it.absolutePath }.join(File.pathSeparator))
		// Loom supplies the dev-launch flags through argument PROVIDERS, not plain jvmArgs. Dropping them
		// starts a server that dies before printing anything, which reads as a server that is merely slow.
		def jvm = new ArrayList<String>(run.jvmArgs)
		run.jvmArgumentProviders.each { jvm.addAll(it.asArguments()) }
		// Joined with NUL, which TestServer.split() splits on, and not a space: on Windows loom passes the
		// dev-launch flags in an @argfile whose path can contain spaces, and a space-joined list comes back as
		// the wrong arguments -- a server that exits before printing anything. Written as the escape rather
		// than the character itself: a literal NUL makes git treat this whole file as binary, so it has no
		// diffs and no history anyone can read.
		props.setProperty("jvmArgs", jvm.join("\u0000"))
		props.setProperty("args", run.args.join("\u0000"))
		def out = launchFile.get().asFile
		out.parentFile.mkdirs()
		out.withOutputStream { props.store(it, "Launch spec for the anticheat test server") }
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "testkit-gametest"
	}
}

dependencies {
	gametestImplementation sourceSets.client.output
}

def failedFile = layout.buildDirectory.file("gametest-failed.txt").get().asFile

tasks.matching { it.name == "runClientGameTest" }.configureEach {
	// --- keep the test window off the main monitor --------------------------------------------------
	//
	// A run opens a real Minecraft window, and by default it lands on the primary monitor on top of whatever
	// is actually being played there. Minecraft has no way to ask for a window position, and the window does
	// not exist yet at this point, so a detached watcher waits for it and moves it once. It identifies the
	// window by this project's path in the process command line rather than by title - every Minecraft window
	// has the same title, and moving the wrong one would drag a real game off-screen.
	//
	// -PtestWindow=x,y,w,h to put it somewhere else; -PtestWindow=off to leave it alone.
	// The window placer also clears any client left over from a previous run, which is what keeps
	// deleteGameTestRunDir from failing on open file handles - so it runs even when placement is off.
	// --- and turn it down ---------------------------------------------------------------------------
	//
	// killer560 (2026-09-29): "can you make the audio like 3% it is very loud." A run opens a real client on
	// his desktop at full volume, several times an hour.
	//
	// It has to be written HERE rather than left in options.txt, because deleteGameTestRunDir wipes the game
	// directory before every run and the client then writes a fresh options.txt at defaults. doFirst runs
	// after that wipe and before the client starts, which is the one window where the file survives to be
	// read. Only the sound lines are written; Minecraft fills in every other option with its default.
	//
	// killer560 (2026-10-04): "have all those test instances you open have the audio muted." Default is now 0.
	// -PtestVolume=0.5 to change it for a run, -PtestVolume=1 for full.
	doFirst {
		def volume = (project.findProperty("testVolume") ?: "0").toString()
		def runDir = file("build/run/clientGameTest")
		runDir.mkdirs()
		def options = new File(runDir, "options.txt")
		def existing = options.exists() ? options.readLines() : []
		def keep = existing.findAll { !it.startsWith("soundCategory_") }
		def sound = ["master", "music", "record", "weather", "block", "hostile", "neutral", "player",
					 "ambient", "voice", "ui"].collect { "soundCategory_${it}:${volume}" }
		options.text = (keep + sound).join(System.lineSeparator()) + System.lineSeparator()
		logger.lifecycle("Test client volume set to ${volume}")
	}

	doFirst {
		def where = project.findProperty("testWindow") ?: "-1920,361,1920,1080"  // left monitor, borderless
		if (where != "off") {
			def p = where.toString().split(",")
			def script = file("place-test-window.ps1")
			if (script.exists() && p.length == 4) {
				new ProcessBuilder("powershell", "-NoProfile", "-WindowStyle", "Hidden", "-File",
						script.absolutePath, "-X", p[0], "-Y", p[1], "-Width", p[2], "-Height", p[3],
						// This checkout's root; the script anchors it with a trailing slash so a sibling
						// checkout's client is never "a leftover" of this one.
						"-Marker", rootDir.absolutePath.replace('\\', '/'))
						.directory(script.parentFile).start()
				logger.lifecycle("Test window will be moved to ${where}")
			}
		}
	}

	// --- the mod under test ---------------------------------------------------------------------------
	//
	// The client gametest API rebuilds its game directory every run, so a jar dropped in run/.../mods is
	// deleted before loader ever scans it. Loader's own fabric.addMods takes absolute paths instead, and its
	// RuntimeModRemapper maps a production jar from intermediary to named on the way in - so what gets tested
	// is the ACTUAL SHIPPED JAR, not a dev-classpath rebuild of it.
	//   ./gradlew runClientGameTest -Pscenario=... -PmodUnderTest=C:/path/to/mod.jar
	if (project.hasProperty("modUnderTest")) {
		def jars = project.property("modUnderTest").toString().split(",").collect {
			def f = file(it.trim())
			if (!f.exists()) throw new GradleException("modUnderTest not found: ${f}")
			f.absolutePath
		}
		systemProperty "fabric.addMods", jars.join(File.pathSeparator)
		doFirst { logger.lifecycle("Mod under test: ${jars.join(', ')}") }
	}
	dependsOn "writeTestServerLaunch"
	systemProperty "testkit.testserver.launch",
			layout.buildDirectory.file("testserver-launch.properties").get().asFile.absolutePath
	// A failing test no longer ends the run (dev.testkit.harness.SuiteVerdict): the run carries on and writes
	// the names of what failed here, for -Pfailed to read back.
	systemProperty "testkit.failedFile", failedFile.absolutePath
	// Run one scenario:  -Pscenario=my-thing   or several, in one launch:  -Pscenario=my-thing,other-thing
	if (project.hasProperty("scenario")) {
		systemProperty "testkit.scenario", project.property("scenario")
	}
	// List the scenarios the filter selects and exit: no server, no world. -PlistScenarios=<file> writes a TSV
	// (name, state, unit, kind) that run-sharded.ps1 splits across clients. See dev.testkit.harness.ScenarioList.
	if (project.hasProperty("listScenarios")) {
		systemProperty "testkit.listFile", file(project.property("listScenarios").toString()).absolutePath
	}
	// Play each selected 93-solve room N times in one launch, to measure a flake rate:  -PsolveRepeat=N
	if (project.hasProperty("solveRepeat")) {
		systemProperty "testkit.solveRepeat", project.property("solveRepeat")
	}
	// Lag spikes for the 93-solve watch:  -PserverStallMs=150 [-PserverStallEvery=13]  (see SimPuzzleSolveTests)
	// or the client connection's netty loop instead:  -PnetStallMs=120
	// and/or Ice Fill's negative control before the auto plays, plus a mistake forced mid-section while it plays
	// (sections 1 and 2 by default, or -PicefillBreaks=2):  -PicefillControl=true
	["serverStallMs", "serverStallEvery", "netStallMs", "icefillControl", "icefillBreaks", "floorRepeat"].each { p ->
		if (project.hasProperty(p)) {
			systemProperty "testkit.${p}", project.property(p)
		}
	}
	// Re-run only what failed last time:  -Pfailed
	if (project.hasProperty("failed")) {
		if (!failedFile.exists() || failedFile.text.trim().isEmpty()) {
			throw new GradleException("-Pfailed: nothing failed last run (no ${failedFile})")
		}
		systemProperty "testkit.scenario", failedFile.text.trim()
	}
	// Run the bodies on a server with no anticheat at all, to separate "my module is broken" from "Grim
	// objects". prepareTestServer takes the jar out of the staged server for this run.
	if (project.hasProperty("nogrim")) {
		systemProperty "testkit.nogrim", "true"
	}
	// Point a scenario that benches on a saved world at a different save:  -Pworld=<folder under run/saves>
	if (project.hasProperty("world")) {
		systemProperty "testkit.world", project.property("world")
	}

	// --- WP1 foundation -----------------------------------------------------------------------------------
	//
	// This checkout's root, so scripts and the harness can tell its client from a sibling checkout's.
	systemProperty "testkit.checkout", rootDir.absolutePath.replace('\\', '/')
	// The Hx RPC bridge port (server port + 5). The server gets the same number through the launch spec.
	systemProperty "testkit.hx.port", hxPort.toString()

	// -Psuite=<name>: a named scenario filter from suites.properties. Exclusive with -Pscenario / -Pfailed, because
	// silently preferring one of two filters is how a run tests something other than what was asked.
	if (project.hasProperty("suite")) {
		if (project.hasProperty("scenario") || project.hasProperty("failed")) {
			throw new GradleException("-Psuite cannot be combined with -Pscenario or -Pfailed")
		}
		def suites = new Properties()
		file("suites.properties").withInputStream { suites.load(it) }
		def suiteName = project.property("suite").toString().trim()
		def filter = suites.getProperty(suiteName)
		if (filter == null) {
			throw new GradleException("-Psuite=${suiteName}: no such suite in suites.properties (have: "
					+ suites.stringPropertyNames().sort().join(", ") + ")")
		}
		systemProperty "testkit.scenario", filter.trim()
		systemProperty "testkit.suite", suiteName
		doFirst { logger.lifecycle("Suite ${suiteName}: ${filter.trim()}") }
	}

	// Real-machine side effects stay off by default (docs/TESTING-HOOKS.md in the mod):
	//   killer560.net.offline         every mod HTTP/WebSocket call fails like a dead network, except hosts named by
	//                                 a killer560.net.<service> override.   Opt out: -PnetOnline
	//   killer560.test.noExternalOpen folder/link/browser opens become a "[TestHook] would open" log line.
	//                                                                        Opt out: -PallowExternalOpen
	//   testkit.quiet                 Quiet.apply() switches network/OS features off in config. Opt out: -PnoQuiet
	// -PnoQuiet turns all three off. -PnetOverride=hypixel=http://127.0.0.1:25599;noamm=... points services at fakes.
	def noQuiet = project.hasProperty("noQuiet")
	if (!noQuiet && !project.hasProperty("netOnline")) {
		systemProperty "killer560.net.offline", "true"
	}
	if (!noQuiet && !project.hasProperty("allowExternalOpen")) {
		systemProperty "killer560.test.noExternalOpen", "true"
	}
	systemProperty "testkit.quiet", noQuiet ? "false" : "true"
	if (project.hasProperty("netOverride")) {
		project.property("netOverride").toString().split(";").each { pair ->
			def eq = pair.indexOf('=')
			if (eq <= 0) {
				throw new GradleException("-PnetOverride: expected service=url, got '${pair}'")
			}
			systemProperty "killer560.net.${pair.substring(0, eq).trim()}", pair.substring(eq + 1).trim()
		}
	}

	// PrismAccountStore reads Prism's REAL accounts.json (refresh tokens included) unless told otherwise. Always
	// point it at an empty copy in build/, so no run can read or touch his accounts.
	def accountsFixture = file("src/gametest/resources/testkit-fixtures/prism-accounts-empty.json")
	def accountsCopy = layout.buildDirectory.file("testkit-fixtures/prism-accounts.json").get().asFile
	systemProperty "prismaccountswitcher.accountsFile", accountsCopy.absolutePath
	doFirst {
		accountsCopy.parentFile.mkdirs()
		accountsCopy.bytes = accountsFixture.bytes
	}

	// Reports: summary.md / summary.json / cases/ / screens/ / coverage.md, fresh each run.
	def reportDir = layout.buildDirectory.dir("testkit-report").get().asFile
	systemProperty "testkit.reportDir", reportDir.absolutePath
	doFirst {
		if (reportDir.exists()) {
			delete(reportDir)
		}
		reportDir.mkdirs()
	}

	// -PseedConfig=<dir>: copied into the client's config/ AFTER the gametest run dir has been wiped (this doFirst
	// runs after that wipe, the same window the volume lines above use), so the mod finds e.g. its room database
	// on start instead of downloading it. Legacy root names are fine: the mod's ModPaths.migrateAll moves them.
	if (project.hasProperty("seedConfig")) {
		def seed = file(project.property("seedConfig").toString())
		if (!seed.isDirectory()) {
			throw new GradleException("-PseedConfig must be a directory; got ${seed}")
		}
		doFirst {
			def target = file("build/run/clientGameTest/config")
			target.mkdirs()
			copy {
				from seed
				into target
			}
			logger.lifecycle("Seeded client config from ${seed}")
		}
	}
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
