# Machine configuration, committed with portable defaults. An EMPTY value means "use the built-in default" named in
# the comment above it. Do not put one machine's paths here: put them in testkit.local.properties (same keys,
# gitignored), or set the environment variable named beside each key. Lookup order, first non-empty wins:
#   script parameter > environment variable > testkit.local.properties (this checkout, then the main checkout when
#   this is a git worktree) > this file > built-in default.
# Relative paths are resolved against the main checkout. Read by tools/testkit-config.ps1 (every script) and by
# build.gradle (what the gametest client needs). Run ./doctor.ps1 to see the resolved values and where each came from.

# Snapshot folders of the mod under test: <jarsDir>/<any-name>/<jar>. The scripts default to the newest folder holding
# a jar that matches modJarPattern. get-mod.ps1 writes its builds here.            env TESTKIT_JARS_DIR
# Default: a folder beside the main checkout named <checkout>-jars.
jarsDir=

# Which jar in a snapshot folder is the default mod under test; {mc} is the Minecraft version of the run.
# Point it at your own mod (e.g. mymod-*.jar) to make it the default.              env TESTKIT_MOD_JAR_PATTERN
# Default: killer560smod-*-{mc}-cheat.jar
modJarPattern=

# A checkout of killer560s-mod. Optional: only get-mod.ps1 and the logic suite's source checks use it; without it those
# checks SKIP with a reason.                                                         env TESTKIT_MOD_SOURCE
# Default: killer560s-mod beside the main checkout.
modSource=

# Where get-mod.ps1 clones the mod from when modSource does not exist yet.          env TESTKIT_MOD_REPO
# Default: https://github.com/Killer560-OG/killer560s-mod.git
modRepo=

# A PrismLauncher instances folder holding killer560s-mod room captures and room database (the dungeon sim scenarios
# need them). Optional: without it every sim scenario that needs captures SKIPs and says so.
#                                                                                    env TESTKIT_PRISM_INSTANCES
# Default: none.
prismInstances=

# Instance (folder name under prismInstances) whose config has the room captures most sim scenarios copy.
#                                                                                    env TESTKIT_ROOMS_INSTANCE
# Default: 26.1.2 (Mod Only Test)
roomsInstance=

# Instance whose captures 99-sim-essence-aura and 99-sim-aura-rebuild copy.        env TESTKIT_SIM_INSTANCE
# (The 93-solve rooms use roomsInstance, unless the environment variable TESTKIT_SIM_INSTANCE names another.)
# Default: Map Logger
simInstance=

# The monitor test windows are tiled on (a quadrant each, a finer grid past four live runs): "auto", "off", or
# x,y,width,height in screen pixels. auto = the first monitor that is not the primary one (leftmost), else the
# primary monitor's working area.                                                   env TESTKIT_WINDOW_SCREEN
# Default: auto
windowScreen=

# Slot files that let concurrent runs (any checkout or worktree) share the screen.   env TESTKIT_WINDOW_SLOTS_DIR
# Default: <jarsDir>/.window-slots
windowSlotsDir=

# Worktree roots for run-sharded.ps1 and parallel-suite.ps1.         env TESTKIT_SHARDS_DIR / TESTKIT_WORKTREES_DIR
# Default: <checkout>-shards and <checkout>-wt beside the main checkout.
shardsDir=
worktreesDir=
