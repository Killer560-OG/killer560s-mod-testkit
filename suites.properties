# Named scenario filters for -Psuite=<name> (run-suite.ps1 -Suite <name>). The value is the same comma list
# -Pscenario takes: each part selects every scenario (and every Session case) whose name CONTAINS it.
#
# Frozen after WP1: a WP that needs a new suite asks in docs/requests/<wp>.md.

# The harness checking itself. Run after any harness change (AGENTS.md section 7).
harness=00-smoke,01-proof,02-seed
# WP1's own acceptance: the harness plus the Session demo with its positive controls.
foundation=00-smoke,01-proof,02-seed,099-session-demo
demo=099-session-demo
# Fails ON PURPOSE (exactly one failure, 098-session-failpath-fails): proves a failing case is reported with a
# screenshot, the session carries on, and a kicked client is re-connected. Only runs when named.
failpath=098-session-failpath

# One per work package. Scenario names carry the tag, so the tag selects the whole package.
hx=-hx-
menu=-menu-
ui=-ui-
logic=-logic-
dsim=-dsim-
boss=-boss-

# The auto puzzle suite (11 rooms plus its summary).
solve=93-solve

# ANY mod, or none: the scenarios that measure whatever mod is loaded (anticheat sweeps on movement, combat, placement
# and speed, the 65 join fingerprint with the jar's own mod id, hostile chat, entity reach) plus the harness checks.
# They must pass with -NoMod and with someone else's mod. 35-combat-hopping-target is left out: upstream's hopping bot
# rises 0.79 blocks where a jump is 1.25, so it fails on its own whatever is loaded.
generic=00-smoke,01-proof,02-seed,-example-,-move-,30-combat,31-combat,32-combat,33-combat,34-combat,-place-,65-join-fingerprint,85-entity-reach,86-hostile-chat,91-speed-100,95-speed-550,96-speed-600
# Everything that drives killer560s-mod itself (@RequiresMod("killer560smod")): without that mod each one is a SKIP row
# saying so. Not included: 95-fps-bench and 403-perf-hub (only when named).
k560=-sim-,-ar-,-ui-,-logic-,93-solve,-breaker-,48-speed-control,60-secret,61-auto-sell,62-full-block,-aim-,-camera-,-reach-at-,64-correction-alarm,87-chat-tidy,77-lever-scan,98-crypt-waypoints,62-argrim,63-ap3,66-auto-inventory,099-session-demo,-hx-,-menu-,-boss-,-secret-aura-lever
