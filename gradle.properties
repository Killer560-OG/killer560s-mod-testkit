org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Fabric — check these on https://fabricmc.net/develop
# 26.3 is the main version since 2026-11-01 (26.2 the second; 26.1.2 dropped). -Pminecraft_version=26.2 switches the
# whole build: build.gradle's versionsByMinecraft fills in that version's Fabric API, loader and cloud-fabric.
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.17-SNAPSHOT
fabric_api_version=0.165.0+26.3

mod_version=1.0.0
maven_group=dev.testkit

# GrimAC, used as a test fixture. Pinned to an exact Modrinth build so a run is reproducible.
# 2.3.74 is the stable release of 2026-10-21 (Modrinth version FNJlsq5U, sha512 26dd646ec414ab59...); its fabric.mod.json
# declares minecraft ">=26.1.2 <26.4" (PacketEvents 2.14.1). The earlier pin, the alpha dev build 2.3.74-8eb5f28 of
# 2026-09-10, stopped at "<26.3". What changed between them: docs/minecraft-263.md.
grim_version=2.3.74
grim_url=https://cdn.modrinth.com/data/LJNGWSvH/versions/FNJlsq5U/grimac-fabric-2.3.74.jar

# GrimAC does not bundle these and will not start without them.
# cloud-fabric 2.0.0-beta.17 declares minecraft >=26.2 (and is the one GrimAC 2.3.74 nests); 2.1.0 declares >=26.3.
cloud_version=2.0.0-beta.17
sqlite_version=3.50.3.0
